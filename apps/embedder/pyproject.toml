[project]
name = "talkfront-embedder"
version = "0.1.0"
description = "Talkfront embedder: multilingual sentence embeddings on CPU (ONNX) plus a knowledge backfill loop"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "onnxruntime==1.31.0",
    "sentencepiece==0.2.2",
    "numpy==2.5.4",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkfront_embedder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
