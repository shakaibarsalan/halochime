[project]
name = "talkfront-agent"
version = "0.1.0"
description = "Talkfront voice/text support agent worker (LiveKit Agents)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "livekit-agents==1.8.6",
    "livekit-plugins-deepgram==1.8.6",
    "livekit-plugins-anthropic==1.8.6",
    "livekit-plugins-silero==1.8.6",
    "livekit-plugins-turn-detector==1.8.6",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "livekit-plugins-groq==1.8.6",
    "livekit-plugins-elevenlabs==1.8.6",
    "livekit-plugins-cartesia==1.8.6",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkfront_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
