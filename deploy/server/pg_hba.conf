# Who may connect, and how. Everything needs a scram-sha-256 password.
# The admin role only works from inside the server; the app role only over TLS.
# TYPE   DATABASE   USER            ADDRESS        METHOD
local    all        all                            scram-sha-256
host     all        all             127.0.0.1/32   scram-sha-256
hostssl  talkfront  talkfront_app   0.0.0.0/0      scram-sha-256
hostssl  talkfront  talkfront_app   ::/0           scram-sha-256
# Read-only viewer (Beekeeper): over TLS, like the app role.
hostssl  talkfront  talkfront_viewer 0.0.0.0/0     scram-sha-256
hostssl  talkfront  talkfront_viewer ::/0          scram-sha-256
